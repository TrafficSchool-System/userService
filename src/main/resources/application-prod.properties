# ==========================================
# PRODUCTION PROFILE (Railway/Docker/Kubernetes)
# ==========================================
# Activate: SPRING_PROFILES_ACTIVE=prod

# =========================
# DATABASE - DEDICATED FOR USER SERVICE
# =========================
# RAILWAY SETUP:
# Create separate MySQL instance for UserService with these env vars:
# - MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql-user}:${MYSQLPORT:3306}/${MYSQLDATABASE:userServiceDb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# =========================
# SERVER
# =========================
server.port=${PORT:8081}

# =========================
# EUREKA - ENABLED
# =========================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

# Eureka Instance
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${SERVICE_NAME:user-service}
eureka.instance.non-secure-port=8081
eureka.instance.instance-id=${eureka.instance.hostname}:${server.port}

# =========================
# SENDGRID - PRODUCTION
# =========================
# CRITICAL: Set real SENDGRID_API_KEY in Railway!
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@trafficschool.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Traffic School}

# =========================
# MAGIC LINK - PRODUCTION FRONTEND
# =========================
magic.link.base.url=${FRONTEND_URL}/verify
magic.link.expiration=${MAGIC_LINK_EXPIRATION:300000}

# =========================
# LOGGING - INFO
# =========================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.example.userService=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# =========================
# JPA - HIDE SQL
# =========================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
