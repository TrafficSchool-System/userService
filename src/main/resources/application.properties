

spring.application.name=user-service

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

#Server Port (Skiljer sig från övriga mikrotjänster)
server.port=${SERVER_PORT:8081}


#Database Configuration 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/userServiceDb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=UserServiceHikariPool

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

#Log
spring.output.ansi.enabled=ALWAYS
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mail Configuration (Legacy SMTP - optional)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SendGrid Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@trafficschool.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Traffic School}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Service-to-Service API Key
# VIKTIGT: Ändra denna nyckel i produktion! Använd miljövariabel SERVICE_API_KEY
# Denna nyckel används för att säkra intern kommunikation mellan microservices
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# Magic Link Configuration
magic.link.expiration=${MAGIC_LINK_EXPIRATION:300000}
magic.link.base.url=${MAGIC_LINK_BASE_URL:http://localhost:3000/verify}

# Svensk tid
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Stockholm
spring.jackson.time-zone=Europe/Stockholm
spring.jackson.date-format=yyyy-MM-dd HH:mm

# Actuator Configuration (Health checks & Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always