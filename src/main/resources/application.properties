
# ==========================================
# SHARED CONFIGURATION (ALL ENVIRONMENTS)
# ==========================================
# Profile-specific overrides:
# - application-local.properties (local development)
# - application-prod.properties (Railway/Docker/K8s)

# =========================
# APPLICATION
# =========================
spring.application.name=user-service

# Default profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================
# DATABASE - SHARED CONFIG
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=UserServiceHikariPool

# =========================
# JPA/HIBERNATE - SHARED CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Timezone - UTC for consistency
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================
# JWT CONFIGURATION
# =========================
# CRITICAL: Must match API Gateway's JWT_SECRET!
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# SERVICE-TO-SERVICE API KEY
# =========================
# CRITICAL: Must match all other services!
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# =========================
# MAIL CONFIGURATION (Legacy SMTP - NOT USED)
# =========================
# Using SendGrid instead, configured per profile
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# LOGGING - SHARED PATTERN
# =========================
spring.output.ansi.enabled=ALWAYS

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always