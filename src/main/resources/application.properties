
# =========================
# APPLICATION INFO
# =========================
spring.application.name=user-service
server.port=8081

# =========================
# DATABASE CONFIGURATION
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/userServiceDb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=UserServiceHikariPool

# =========================
# JPA/HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Svensk tid
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Stockholm
spring.jackson.time-zone=Europe/Stockholm
spring.jackson.date-format=yyyy-MM-dd HH:mm

# =========================
# EUREKA CLIENT
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# JWT CONFIGURATION
# =========================
# CRITICAL: Must match API Gateway's JWT_SECRET!
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# SERVICE-TO-SERVICE API KEY
# =========================
# CRITICAL: Must match all other services!
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# =========================
# SENDGRID EMAIL
# =========================
sendgrid.api.key=${SENDGRID_API_KEY:dummy_key_for_local_testing}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@trafficschool.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Traffic School}

# =========================
# MAGIC LINK
# =========================
magic.link.expiration=${MAGIC_LINK_EXPIRATION:300000}
magic.link.base.url=${MAGIC_LINK_BASE_URL:http://localhost:3000/verify}

# =========================
# MAIL CONFIGURATION (Legacy SMTP)
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# LOGGING
# =========================
spring.output.ansi.enabled=ALWAYS
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.userService=DEBUG

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always