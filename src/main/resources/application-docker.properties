# =========================
# DOCKER COMPOSE PROFILE
# =========================
# Activate: SPRING_PROFILES_ACTIVE=docker
# Used by docker-compose.yml

# Database - Docker container hostname
spring.datasource.url=jdbc:mysql://mysql:3306/trafficschool

# Eureka - Docker container hostname
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=user-service

# Magic Link - Can be localhost:3000 or deployed frontend
magic.link.base.url=http://localhost:3000/verify

# Logging - Less verbose in Docker
logging.level.com.example.userService=INFO
logging.level.org.springframework.security=INFO
