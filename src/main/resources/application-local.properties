# ==========================================
# LOCAL DEVELOPMENT PROFILE
# ==========================================
# Activate: spring.profiles.active=local (default)

# =========================
# DATABASE - DEDICATED FOR USER SERVICE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/userServiceDb?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# =========================
# SERVER
# =========================
server.port=8081

# =========================
# EUREKA - ENABLED (Gateway använder lb://)
# =========================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# INTERNAL SERVICE API KEY
# =========================
service.api.key=TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD

# =========================
# RESEND - LOCAL
# =========================
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:noreply@trafficschool.com}
resend.from.name=${RESEND_FROM_NAME:Traffic School (Local)}
welcome.email.fail-on-error=false

# =========================
# MAGIC LINK - LOCAL FRONTEND
# =========================
magic.link.base.url=http://localhost:5173/verify
magic.link.expiration=300000

# =========================
# SERVICE URLS - DIRECT HTTP
# =========================
payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}

# =========================
# LOGGING
# =========================
# Log levels are configured in logback-spring.xml (profile-aware)
# Uncomment below only to temporarily override a specific logger
# logging.level.com.example.userService=TRACE

# =========================
# JPA - SHOW SQL
# =========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
