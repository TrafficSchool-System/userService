# ==========================================
# LOCAL DEVELOPMENT PROFILE
# ==========================================
# Activate: spring.profiles.active=local (default)

# =========================
# DATABASE - DEDICATED FOR USER SERVICE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/userServiceDb?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# =========================
# SERVER
# =========================
server.port=8081

# =========================
# EUREKA - ENABLED (Gateway använder lb://)
# =========================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# SENDGRID - TEST MODE
# =========================
sendgrid.api.key=dummy_key_for_local_testing
sendgrid.from.email=noreply@trafficschool.com
sendgrid.from.name=Traffic School (Local)

# =========================
# MAGIC LINK - LOCAL FRONTEND
# =========================
magic.link.base.url=http://localhost:5173/verify
magic.link.expiration=300000

# =========================
# LOGGING
# =========================
# Log levels are configured in logback-spring.xml (profile-aware)
# Uncomment below only to temporarily override a specific logger
# logging.level.com.example.userService=TRACE

# =========================
# JPA - SHOW SQL
# =========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
