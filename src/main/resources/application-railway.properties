# =========================
# RAILWAY PRODUCTION PROFILE
# =========================
# Activate: SPRING_PROFILES_ACTIVE=railway
# Set in Railway environment variables

# Database - Railway MySQL (environment variable)
# Railway provides: MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Eureka - ENABLED for Railway
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance - Railway Private Networking
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=user-service.railway.internal
eureka.instance.non-secure-port=8081
eureka.instance.instance-id=${eureka.instance.hostname}:${server.port}

# Magic Link - Production frontend URL
magic.link.base.url=${FRONTEND_URL:https://trafficschool.com}/verify

# Logging - Production level
logging.level.com.example.userService=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false

# Production optimizations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
