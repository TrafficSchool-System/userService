# =========================
# RAILWAY PRODUCTION PROFILE
# =========================
# Activate: SPRING_PROFILES_ACTIVE=railway
# Set in Railway environment variables

# Database - Railway MySQL (environment variable)
spring.datasource.url=${DATABASE_URL}

# Eureka - ENABLED for Railway
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Magic Link - Production frontend URL
magic.link.base.url=${FRONTEND_URL:https://trafficschool.com}/verify

# Logging - Production level
logging.level.com.example.userService=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false

# Production optimizations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
